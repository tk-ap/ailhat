version: 0.1.0
product_key: ailhat
agent_os_repository: tk-ap/agent-os
routing_source: registry/product-routing.yaml

inbound:
  - from: agent-os-workforce
    contract: contracts/outcome-event.schema.json
    purpose: measure whether governed work improved the originating portfolio objective
  - from: alvira-meos
    contract: contracts/context-envelope.schema.json
    purpose: consume approved context when it materially improves portfolio interpretation
  - from: ledgato
    contract: contracts/outcome-event.schema.json
    purpose: consume governance or enforcement evidence when a portfolio item materially depends on it

outbound:
  - to: agent-os-workforce
    contract: contracts/work-item.schema.json
    trigger: an evidence-backed finding or initiative is approved for governed action

cross_market:
  - trigger: an accepted initiative requires shared workforce composition or execution
    destination: agent-os-workforce
    message: Convert the accepted portfolio intent into a governed task and minimum-sufficient workforce.
  - trigger: an initiative requires approved human or operating context
    destination: alvira-meos
    message: Request only the minimum relevant ALVIRA context through a context envelope.
  - trigger: an initiative materially requires governance or enforcement proof
    destination: ledgato
    message: Route only the governance/enforcement portion; do not treat LEDGATo as generic authorization intelligence.

rules:
  use_portable_contracts_for_cross_product_handoffs: true
  cross_market_policy: policies/CROSS_MARKET_POLICY.md
  integration_claims_require_verified_implementation: true
  findings_and_work_items_do_not_grant_execution_authority: true
