name: Mobile owner connections live proof

on:
  push:
    branches:
      - qa/mobile-owner-surfaces-20260922

permissions:
  contents: read

jobs:
  mobile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/mobile-owner-connections-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-owner-connections-proof
          path: .mobile-proof
          if-no-files-found: warn
          retention-days: 2
